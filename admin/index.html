<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel — Fresh Mango BD</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: #f0f4f8;
        color: #1f2937;
        min-height: 100vh;
      }

      /* --- SIDEBAR --- */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 240px;
        background: #1b5e20;
        color: white;
        display: flex;
        flex-direction: column;
        padding: 24px 0;
        z-index: 100;
      }
      .sidebar-logo {
        padding: 0 24px 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 16px;
      }
      .sidebar-logo .logo-text {
        font-size: 1.15rem;
        font-weight: 700;
        color: #ffd166;
      }
      .sidebar-logo .logo-sub {
        font-size: 0.72rem;
        color: rgba(255, 255, 255, 0.5);
        margin-top: 2px;
      }
      .sidebar nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        color: rgba(255, 255, 255, 0.75);
        text-decoration: none;
        font-size: 0.92rem;
        font-weight: 500;
        transition: all 0.2s;
      }
      .sidebar nav a:hover,
      .sidebar nav a.active {
        background: rgba(255, 255, 255, 0.12);
        color: #ffd166;
        border-left: 3px solid #ffd166;
      }
      .sidebar-footer {
        margin-top: auto;
        padding: 20px 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .sidebar-footer a {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.82rem;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sidebar-footer a:hover {
        color: #ffd166;
      }

      /* --- MAIN --- */
      .main {
        margin-left: 240px;
        min-height: 100vh;
      }
      .topbar {
        background: white;
        padding: 16px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #e5e7eb;
        position: sticky;
        top: 0;
        z-index: 50;
      }
      .topbar h1 {
        font-size: 1.2rem;
        font-weight: 700;
        color: #1f2937;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .refresh-btn {
        padding: 8px 16px;
        background: #2e7d32;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
      }
      .refresh-btn:hover {
        background: #388e3c;
      }

      .content {
        padding: 32px;
      }

      /* --- STATS CARDS --- */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;
        margin-bottom: 32px;
      }
      .stat-card {
        background: white;
        border-radius: 12px;
        padding: 24px 20px;
        border-left: 4px solid;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      .stat-card.total {
        border-color: #2e7d32;
      }
      .stat-card.pending {
        border-color: #f59e0b;
      }
      .stat-card.confirmed {
        border-color: #3b82f6;
      }
      .stat-card.delivered {
        border-color: #10b981;
      }
      .stat-card.cancelled {
        border-color: #ef4444;
      }
      .stat-card.kg {
        border-color: #8b5cf6;
      }
      .stat-label {
        font-size: 0.78rem;
        font-weight: 600;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }
      .stat-value {
        font-size: 2rem;
        font-weight: 700;
        color: #1f2937;
      }
      .stat-icon {
        font-size: 1.5rem;
        float: right;
        margin-top: -4px;
      }

      /* --- TABLE SECTION --- */
      .table-section {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        overflow: hidden;
      }
      .table-header {
        padding: 20px 24px;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: gap;
      }
      .table-header h2 {
        font-size: 1.05rem;
        font-weight: 700;
      }
      .filter-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .filter-select,
      .filter-input {
        padding: 8px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 0.85rem;
        outline: none;
        font-family: inherit;
      }
      .filter-select:focus,
      .filter-input:focus {
        border-color: #2e7d32;
      }

      .table-wrapper {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
      }
      th {
        background: #f9fafb;
        padding: 12px 16px;
        text-align: left;
        font-size: 0.78rem;
        font-weight: 700;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid #e5e7eb;
      }
      td {
        padding: 14px 16px;
        border-bottom: 1px solid #f3f4f6;
        vertical-align: middle;
      }
      tr:hover td {
        background: #fafafa;
      }
      tr:last-child td {
        border-bottom: none;
      }

      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 50px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .badge-pending {
        background: #fef3c7;
        color: #92400e;
      }
      .badge-confirmed {
        background: #dbeafe;
        color: #1e40af;
      }
      .badge-delivered {
        background: #d1fae5;
        color: #065f46;
      }
      .badge-cancelled {
        background: #fee2e2;
        color: #991b1b;
      }

      .action-select {
        padding: 6px 10px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 0.82rem;
        cursor: pointer;
        outline: none;
        font-family: inherit;
        background: white;
      }
      .action-select:focus {
        border-color: #2e7d32;
      }

      .delete-btn {
        padding: 6px 12px;
        background: #fee2e2;
        color: #991b1b;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 600;
        transition: all 0.2s;
      }
      .delete-btn:hover {
        background: #fecaca;
      }

      .view-btn {
        padding: 6px 12px;
        background: #dbeafe;
        color: #1e40af;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 600;
        transition: all 0.2s;
      }
      .view-btn:hover {
        background: #bfdbfe;
      }

      .empty-state {
        text-align: center;
        padding: 64px 24px;
        color: #9ca3af;
      }
      .empty-state .emoji {
        font-size: 3rem;
        margin-bottom: 12px;
      }

      /* --- LOADING --- */
      .loading {
        text-align: center;
        padding: 48px;
        color: #6b7280;
        font-size: 1rem;
      }
      .spinner {
        display: inline-block;
        width: 32px;
        height: 32px;
        border: 3px solid #e5e7eb;
        border-top-color: #2e7d32;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
      }

      /* --- DETAIL MODAL --- */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }
      .modal-overlay.active {
        display: flex;
      }
      .modal-box {
        background: white;
        border-radius: 16px;
        padding: 32px;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      }
      .modal-box h3 {
        font-size: 1.1rem;
        font-weight: 700;
        margin-bottom: 20px;
        color: #1b5e20;
      }
      .detail-row {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #f3f4f6;
        font-size: 0.9rem;
      }
      .detail-label {
        font-weight: 600;
        color: #6b7280;
      }
      .detail-value {
        color: #1f2937;
        text-align: right;
        max-width: 280px;
      }
      .modal-close {
        margin-top: 24px;
        padding: 10px 20px;
        background: #2e7d32;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-family: inherit;
        width: 100%;
      }

      /* --- TOAST --- */
      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: #1b5e20;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 0.88rem;
        font-weight: 500;
        z-index: 9999;
        transform: translateY(80px);
        opacity: 0;
        transition: all 0.3s;
      }
      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 768px) {
        .sidebar {
          transform: translateX(-100%);
        }
        .main {
          margin-left: 0;
        }
        .content {
          padding: 20px 16px;
        }
      }
    </style>
  </head>
  <body>

      style="
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #1b5e20;

      "
    >
      <div
        style="
          background: white;
          border-radius: 16px;
          padding: 48px 40px;
          text-align: center;
          width: 90%;
          max-width: 380px;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        "
      >
        <div style="font-size: 3rem; margin-bottom: 12px">🥭</div>

        </p>
        <!-- <input
          type="password"

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar">
      <div class="sidebar-logo">
        <div style="font-size: 2rem; margin-bottom: 6px">🥭</div>
        <div class="logo-text">FreshMangoBD</div>
        <div class="logo-sub">Admin Dashboard</div>
      </div>
      <nav>
        <a href="#" class="active"
          ><i class="fas fa-tachometer-alt" style="width: 16px"></i>
          Dashboard</a
        >
        <a href="#" onclick="loadOrders()"
          ><i class="fas fa-shopping-bag" style="width: 16px"></i> All Orders</a
        >
        <a href="/" target="_blank"
          ><i class="fas fa-globe" style="width: 16px"></i> View Website</a
        >
      </nav>
      <div class="sidebar-footer">
        <a href="/"><i class="fas fa-arrow-left"></i> Back to Website</a>
      </div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main">
      <div class="topbar">
        <h1>📦 Order Management</h1>
        <div class="topbar-right">
          <span
            id="lastUpdated"
            style="font-size: 0.78rem; color: #9ca3af"
          ></span>
          <button class="refresh-btn" onclick="loadAll()">
            <i class="fas fa-sync-alt"></i> Refresh
          </button>
        </div>
      </div>

      <div class="content">
        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
          <div class="loading"><div class="spinner"></div></div>
        </div>

        <!-- Orders Table -->
        <div class="table-section">
          <div class="table-header">
            <h2>All Customer Orders</h2>
            <div class="filter-row">
              <input
                class="filter-input"
                id="searchInput"
                type="text"
                placeholder="🔍 Search name or phone..."
                oninput="filterOrders()"
              />
              <select
                class="filter-select"
                id="statusFilter"
                onchange="filterOrders()"
              >
                <option value="">All Status</option>
                <option value="Pending">Pending</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Delivered">Delivered</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>
          </div>
          <div class="table-wrapper">
            <div id="ordersContainer">
              <div class="loading">
                <div class="spinner"></div>
                <br />Loading orders...
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== DETAIL MODAL ===== -->
    <div class="modal-overlay" id="detailModal">
      <div class="modal-box">
        <h3>🥭 Order Details</h3>
        <div id="detailContent"></div>
        <button class="modal-close" onclick="closeDetail()">Close</button>
      </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script>
      const API =
        window.location.hostname === "localhost"
          ? "http://localhost:5000/api"
          : "https://fresh-mangobd-repo.onrender.com/api";
      let allOrders = [];

      async function loadAll() {
        await loadStats();
        await loadOrders();
        document.getElementById("lastUpdated").textContent =
          "Updated: " + new Date().toLocaleTimeString();
      }

      async function loadStats() {
        try {
          const res = await fetch(`${API}/stats`);
          const data = await res.json();
          const s = data.stats;
          document.getElementById("statsGrid").innerHTML = `
        <div class="stat-card total">
          <div class="stat-label">Total Orders <span class="stat-icon">📦</span></div>
          <div class="stat-value">${s.total}</div>
        </div>
        <div class="stat-card pending">
          <div class="stat-label">Pending <span class="stat-icon">⏳</span></div>
          <div class="stat-value">${s.pending}</div>
        </div>
        <div class="stat-card confirmed">
          <div class="stat-label">Confirmed <span class="stat-icon">✅</span></div>
          <div class="stat-value">${s.confirmed}</div>
        </div>
        <div class="stat-card delivered">
          <div class="stat-label">Delivered <span class="stat-icon">🚚</span></div>
          <div class="stat-value">${s.delivered}</div>
        </div>
        <div class="stat-card cancelled">
          <div class="stat-label">Cancelled <span class="stat-icon">❌</span></div>
          <div class="stat-value">${s.cancelled}</div>
        </div>
        <div class="stat-card kg">
          <div class="stat-label">Total KG Sold <span class="stat-icon">⚖️</span></div>
          <div class="stat-value">${parseFloat(s.total_kg || 0).toFixed(1)}</div>
        </div>
      `;
        } catch (e) {
          document.getElementById("statsGrid").innerHTML =
            '<p style="color:#EF4444;padding:12px">⚠️ Could not load stats. Is backend running?</p>';
        }
      }

      async function loadOrders() {
        document.getElementById("ordersContainer").innerHTML =
          '<div class="loading"><div class="spinner"></div><br>Loading orders...</div>';
        try {
          const res = await fetch(`${API}/orders`);
          const data = await res.json();
          allOrders = data.orders || [];
          renderTable(allOrders);
        } catch (e) {
          document.getElementById("ordersContainer").innerHTML =
            '<div class="empty-state"><div class="emoji">⚠️</div><p>Backend not connected. Start the server with <code>node server.js</code></p></div>';
        }
      }

      function renderTable(orders) {
        if (!orders.length) {
          document.getElementById("ordersContainer").innerHTML =
            '<div class="empty-state"><div class="emoji">🥭</div><p>No orders yet. Share the website to get orders!</p></div>';
          return;
        }

        const rows = orders
          .map(
            (o) => `
      <tr>
        <td><strong>#${o.id}</strong></td>
        <td>
          <div style="font-weight:600">${esc(o.customer_name)}</div>
          <div style="font-size:0.78rem;color:#6B7280">${esc(o.phone)}</div>
        </td>
        <td>${esc(o.mango_type)}</td>
        <td><strong>${o.quantity} KG</strong></td>
        <td>${esc(o.delivery_area)}</td>
        <td>${esc(o.payment_method)}</td>
        <td><span class="badge badge-${o.order_status.toLowerCase()}">${o.order_status}</span></td>
        <td style="font-size:0.78rem;color:#6B7280">${formatDate(o.created_at)}</td>
        <td>
          <div style="display:flex;gap:6px;align-items:center">
            <select class="action-select" onchange="updateStatus(${o.id}, this.value)" title="Change Status">
              <option value="">Change Status</option>
              <option value="Pending" ${o.order_status === "Pending" ? "selected" : ""}>Pending</option>
              <option value="Confirmed" ${o.order_status === "Confirmed" ? "selected" : ""}>Confirmed</option>
              <option value="Delivered" ${o.order_status === "Delivered" ? "selected" : ""}>Delivered</option>
              <option value="Cancelled" ${o.order_status === "Cancelled" ? "selected" : ""}>Cancelled</option>
            </select>
            <button class="view-btn" onclick="viewOrder(${o.id})"><i class="fas fa-eye"></i></button>
            <button class="delete-btn" onclick="deleteOrder(${o.id})"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>
    `,
          )
          .join("");

        document.getElementById("ordersContainer").innerHTML = `
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Customer</th><th>Mango Type</th><th>Qty</th>
            <th>Area</th><th>Payment</th><th>Status</th><th>Date</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
      }

      function filterOrders() {
        const search = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const status = document.getElementById("statusFilter").value;
        const filtered = allOrders.filter((o) => {
          const matchSearch =
            !search ||
            o.customer_name.toLowerCase().includes(search) ||
            o.phone.includes(search);
          const matchStatus = !status || o.order_status === status;
          return matchSearch && matchStatus;
        });
        renderTable(filtered);
      }

      async function updateStatus(id, status) {
        if (!status) return;
        try {
          const res = await fetch(`${API}/orders/${id}/status`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status }),
          });
          const data = await res.json();
          if (data.success) {
            showToast(`✅ Order #${id} → ${status}`);
            await loadAll();
          }
        } catch (e) {
          showToast("❌ Could not update status");
        }
      }

      async function deleteOrder(id) {
        if (!confirm(`Delete Order #${id}? This cannot be undone.`)) return;
        try {
          const res = await fetch(`${API}/orders/${id}`, { method: "DELETE" });
          const data = await res.json();
          if (data.success) {
            showToast(`🗑️ Order #${id} deleted`);
            await loadAll();
          }
        } catch (e) {
          showToast("❌ Could not delete order");
        }
      }

      async function viewOrder(id) {
        const order = allOrders.find((o) => o.id === id);
        if (!order) return;
        document.getElementById("detailContent").innerHTML = `
      <div class="detail-row"><span class="detail-label">Order ID</span><span class="detail-value">#${order.id}</span></div>
      <div class="detail-row"><span class="detail-label">Customer</span><span class="detail-value">${esc(order.customer_name)}</span></div>
      <div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value">${esc(order.phone)}</span></div>
      <div class="detail-row"><span class="detail-label">Address</span><span class="detail-value">${esc(order.address)}</span></div>
      <div class="detail-row"><span class="detail-label">Mango Type</span><span class="detail-value">${esc(order.mango_type)}</span></div>
      <div class="detail-row"><span class="detail-label">Quantity</span><span class="detail-value">${order.quantity} KG</span></div>
      <div class="detail-row"><span class="detail-label">Delivery Area</span><span class="detail-value">${esc(order.delivery_area)}</span></div>
      <div class="detail-row"><span class="detail-label">Payment</span><span class="detail-value">${esc(order.payment_method)}</span></div>
      <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value"><span class="badge badge-${order.order_status.toLowerCase()}">${order.order_status}</span></span></div>
      <div class="detail-row"><span class="detail-label">Note</span><span class="detail-value">${order.note || "—"}</span></div>
      <div class="detail-row"><span class="detail-label">Ordered At</span><span class="detail-value">${formatDate(order.created_at)}</span></div>
    `;
        document.getElementById("detailModal").classList.add("active");
      }

      function closeDetail() {
        document.getElementById("detailModal").classList.remove("active");
      }

      document
        .getElementById("detailModal")
        .addEventListener("click", function (e) {
          if (e.target === this) closeDetail();
        });

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 3000);
      }

      function esc(str) {
        if (!str) return "";
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function formatDate(str) {
        if (!str) return "—";
        return new Date(str).toLocaleString("en-BD", {
          dateStyle: "medium",
          timeStyle: "short",
        });
      }

      // Load on page start
      loadAll();
      // Auto-refresh every 60 seconds
      setInterval(loadAll, 60000);
    </script>

    <script>
      const ADMIN_PASSWORD = "1234";
      function togglePass() {
        const input = document.getElementById("adminPass");
        const btn = document.getElementById("eyeBtn");
        if (input.type === "password") {
          input.type = "text";
          btn.textContent = "🙈";
        } else {
          input.type = "password";
          btn.textContent = "👁️";
        }
      }

      function checkLogin() {
        const pass = document.getElementById("adminPass").value;
        const errorEl = document.getElementById("loginError");
        const successEl = document.getElementById("loginSuccess");
        const btn = document.getElementById("loginBtn");

        if (!pass) {
          errorEl.textContent = "⚠️ পাসওয়ার্ড দিন!";
          return;
        }

        btn.textContent = "Loading...";
        btn.disabled = true;

        setTimeout(() => {
          if (pass === ADMIN_PASSWORD) {
            errorEl.textContent = "";
            successEl.textContent = "✅ সফল! প্রবেশ করছেন...";
            setTimeout(() => {
              sessionStorage.setItem("adminLoggedIn", "true");
              document.getElementById("loginScreen").style.display = "none";
              document.getElementById("adminPass").value = "";
              loadAll();
            }, 800);
          } else {
            errorEl.textContent = "❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।";
            btn.textContent = "Login";
            btn.disabled = false;
          }
        }, 300);
      }

      window.onload = function () {
        // Dynamically create password field — browser cannot autofill
        const wrapper = document.getElementById("passWrapper");
        wrapper.innerHTML = `
          <input type="password" id="adminPass" placeholder="পাসওয়ার্ড দিন"
            autocomplete="new-password"
            style="width:100%;padding:12px 48px 12px 16px;border:2px solid #e5e7eb;border-radius:8px;font-size:1rem;outline:none;"
          />
          <button onclick="togglePass()" id="eyeBtn"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.2rem;">
            👁️
          </button>
        `;

        if (sessionStorage.getItem("adminLoggedIn") === "true") {
          document.getElementById("loginScreen").style.display = "none";
        } else {
          document.getElementById("loginScreen").style.display = "flex";
        }
      };
      document.addEventListener("keydown", function (e) {
        if (e.key === "Enter") checkLogin();
      });
    </script>
  </body>
</html>
